name: Build portable app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install bleak pyinstaller

      - name: Build one-file exe
        run: pyinstaller --onefile --console --name bt-battery-drain --collect-all bleak bt_battery_drain.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-battery-drain-windows
          path: dist/bt-battery-drain.exe

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bt-battery-drain.exe
